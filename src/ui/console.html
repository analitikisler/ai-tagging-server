        h('span', { class: 'feature__head' }, h('span', { class: 'feature__name', text: t('ft.' + ft.key + '.name') }), status(ft.state.tone, ft.state.word)),
        h('span', { class: 'feature__line', text: t('ft.' + ft.key + '.line') }),
        ft.state.detail ? h('span', { class: 'feature__detail', text: ft.state.detail }) : null);
      card.addEventListener('click', () => this.open(ft, c, tenant));
      grid.appendChild(card);
    }
    if (!shown.length) box.appendChild(emptyState(t('ft.none'), null));
  },
  open(ft, c, tenant) {
    const body = h('div', { class: 'dialog__body stack' },
      h('h2', { class: 'dialog__title', id: 'dlg-title' }, t('ft.' + ft.key + '.name'), ' ', status(ft.state.tone, ft.state.word)),
      h('p', { text: t('ft.' + ft.key + '.line') }),
      h('p', { class: 'callout__title', text: t('ft.how') }),
      h('p', { class: 'note', text: t('ft.' + ft.key + '.how') }));
    const actions = h('div', { class: 'dialog__actions' });
    const close = h('button', { class: 'button', 'data-variant': 'secondary', type: 'submit', value: 'close' }, t('action.close'));
    const form = h('form', { method: 'dialog' }, body, actions);
    const editable = ft.edit === 'client' && (S.mode === 'multi' || c.editable);
    if (editable) {
      const editor = this.editor(ft.key, clientFeatures(c, tenant));
      body.appendChild(editor.el);
      const msg = h('p', { class: 'message', 'aria-live': 'polite' });
      body.appendChild(msg);
      const save = h('button', { class: 'button', 'data-variant': 'primary', type: 'button' }, S.mode === 'multi' ? t('ft.saveSite') : t('ft.save'));
      save.addEventListener('click', async () => {
        clear(msg);
        let features;
        try { features = editor.read(); } catch (e) { msg.appendChild(status('bad', t('severity.bad'))); msg.appendChild(h('span', { text: e.message })); return; }
        save.disabled = true;
        try {
          await this.save(c, tenant, features);
          form.closest('dialog').close();
          toast('ok', S.mode === 'multi' ? t('ft.savedSite') : t('ft.saved'));
          this.render();
        } catch (e) {
          save.disabled = false;
          if (e.cancelled) return;
          msg.appendChild(status('bad', t('severity.bad'))); msg.appendChild(h('span', { text: e.raw || e.message }));
        }
      });
      actions.appendChild(save);
    } else if (ft.edit === 'client') {
      body.appendChild(h('p', { class: 'callout__title', text: t('ft.where') }));
      body.appendChild(h('p', null, tn('ft.env', { vars: code(t('ft.' + ft.key + '.env')) })));
    } else if (ft.go) {
      const go = h('a', { class: 'button', 'data-variant': 'primary', href: '#' + ft.go }, t('ft.go.' + ft.go));
      go.addEventListener('click', () => form.closest('dialog').close());
      actions.appendChild(go);
    }
    actions.appendChild(close);
    openDialog(form, { size: 'wide' });
  },
  // The fields for one feature; read() returns every feature with these changed.
  editor(key, f) {
    const el = h('div', { class: 'stack' });
    const next = () => JSON.parse(JSON.stringify(f));
    if (key === 'cookies') {
      // Google Analytics, Meta and TikTok are kept by default (the client's
      // extendGaCookie and keepAdCookies).
      el.appendChild(h('p', { class: 'note', text: t('ft.cookies.defaults') }));
      const boxes = COOKIE_GROUPS.filter((g) => ['google_analytics', 'meta', 'tiktok'].indexOf(g) < 0).map((g) => {
        const cb = h('input', { type: 'checkbox', value: g });
        cb.checked = f.keep_cookies.indexOf(g) >= 0;
        el.appendChild(h('label', { class: 'check' }, cb, ' ', t('ft.cookie.' + g)));
        return cb;
      });
      const custom = h('textarea', { class: 'textarea', id: 'ft-custom', 'data-mono': true, rows: 3 });
      custom.value = f.keep_cookies.filter((x) => COOKIE_GROUPS.indexOf(x) < 0).join('\n');
      el.appendChild(h('div', { class: 'field' }, h('label', { class: 'field__label', for: 'ft-custom', text: t('ft.cookies.custom') }), h('span', { class: 'note', text: t('ft.cookies.custom.help') }), custom));
      return { el, read: () => {
        const r = next();
        const keep = f.keep_cookies.filter((g) => ['google_analytics', 'meta', 'tiktok'].indexOf(g) >= 0);
        r.keep_cookies = keep.concat(boxes.filter((b) => b.checked).map((b) => b.value), lines(custom.value));
        return r;
      } };
    }
    if (key === 'clickids') {
      const ta = h('textarea', { class: 'textarea', id: 'ft-alias', 'data-mono': true, rows: 4, placeholder: 'gclid=gc_id\nmsclkid=ms_id' });
      ta.value = Object.entries(f.click_id_aliases || {}).map(([k, v]) => k + '=' + v).join('\n');
      el.appendChild(h('div', { class: 'field' }, h('label', { class: 'field__label', for: 'ft-alias', text: t('ft.clickids.field') }), h('span', { class: 'note', text: t('ft.clickids.help') }), ta));
      return { el, read: () => {
        const r = next();
        r.click_id_aliases = {};
        for (const line of lines(ta.value)) {
          const at = line.indexOf('=');
          if (at < 1 || at === line.length - 1) throw new Error(t('ft.err.alias'));
          r.click_id_aliases[line.slice(0, at).trim()] = line.slice(at + 1).trim();
        }
        return r;
      } };
    }
    if (key === 'visitor' || key === 'ai') {
      const row = switchRow('ft-vi', t('ft.visitor.switch'), t('ft.visitor.switch.help'), f.visitor_info);
      el.appendChild(row.el);
      return { el, read: () => { const r = next(); r.visitor_info = row.sw.getAttribute('aria-checked') === 'true'; return r; } };
    }
    const row = switchRow('ft-bots', t('ft.bots.switch'), t('ft.bots.switch.help'), f.bot_handling === 'flag');
    el.appendChild(row.el);
    return { el, read: () => { const r = next(); r.bot_handling = row.sw.getAttribute('aria-checked') === 'true' ? 'flag' : ''; return r; } };
  },
  async save(c, tenant, features) {
    if (S.mode === 'multi') {
      const tt = S.tenants.find((x) => x.id === tenant);
      const body = Object.assign({}, tt, { features: features });
      delete body.stats;
      await api('PUT', '/admin/api/tenants/' + encodeURIComponent(tenant), body);
      await loadTenants();
      S.containers.delete(containerKey(tenant));
      await getContainer(tenant);
      return;
    }
    C.tenant = tenant;
    const client = ga4Client(c);
    await containerWrite('PUT', '/clients/' + encodeURIComponent(client.name) + '/features', { revision: c.revision, features: features });
  }
};

// ===== Integrations (integrated mode) =====
const IN = { box: null, error: null };
function switchRow(id, name, line, checked) {
  const sw = h('button', { class: 'switch', type: 'button', role: 'switch', 'aria-checked': String(!!checked), 'aria-labelledby': id + '-n', 'aria-describedby': line ? id + '-d' : null, id: id });
  sw.addEventListener('click', () => sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true')));
  return { el: h('div', { class: 'switch-row' }, h('span', { class: 'switch-row__name', id: id + '-n', text: name }), line ? h('span', { class: 'switch-row__line', id: id + '-d', text: line }) : null, sw), sw: sw };
}
function strOr(key, fallback) { const s = lookup(key); return s === key ? fallback : s; }
VIEWS.integrations = {
  mount(main) { IN.box = inner(main); this.load(); },
  update() { this.render(); },
  unmount() { IN.box = null; },
  onData() {},
  load() {
    if (!S.integrations) clear(IN.box).appendChild(skeleton());
    api('GET', '/admin/api/integrations').then((j) => { S.integrations = j; IN.error = null; this.render(); }, (e) => { IN.error = e; this.render(); });
  },
  render() {
    const box = IN.box;
    if (!box) return;
    clear(box);
    const refresh = h('button', { class: 'button', 'data-variant': 'secondary', type: 'button' }, icon('i-refresh', { class: 'icon button__icon' }), t('int.refresh'));
    refresh.addEventListener('click', () => this.load());
    box.appendChild(viewHead('int.title', t('int.lead'), [refresh]));
    if (IN.error) box.appendChild(boxedMessage('bad', errNode(IN.error)));
    const j = S.integrations;
    if (!j) return;
    const cards = h('div', { class: 'cards', 'data-cols': '2' });
    for (const p of j.providers) cards.appendChild(this.provider(p, j.test_events || []));
    cards.appendChild(this.enrichment(j.enrichment));
    box.appendChild(cards);
    const focus = S.route.parts[1];
    if (focus) { const el = document.getElementById('int-' + focus); if (el) el.scrollIntoView({ block: 'start' }); }
  },
  provider(p, testEvents) {
    const inputs = {};
    const body = h('div', { class: 'panel__body stack' }, h('p', { class: 'note', text: strOr('int.' + p.id + '.help', p.help) }));
    const testOn = p.fields.some((f) => (f.key === 'test_event_code' && f.value) || (f.kind === 'toggle' && f.key === 'test_mode' && f.value === 'true'));
    for (const f of p.fields) {
      const id = 'int-' + p.id + '-' + f.key;
      const label = strOr('int.' + p.id + '.' + f.key, f.label) + (f.required ? ' ' + t('int.required') : '');
      const help = strOr('int.' + p.id + '.' + f.key + '.help', f.help || '');
      if (f.kind === 'toggle') {
        const sr = switchRow(id, label, help, f.value === 'true');
        body.appendChild(sr.el); inputs[f.key] = { kind: f.kind, el: sr.sw, f: f };
      } else {
        const input = h('input', { class: 'input', 'data-mono': true, id: id, type: f.kind === 'secret' ? 'password' : 'text', autocomplete: 'off', spellcheck: 'false', value: f.kind === 'secret' ? '' : f.value,
          placeholder: f.kind === 'secret' ? (f.set ? t('int.secretKept') : t('int.secretNew')) : null, 'aria-describedby': help || f.kind === 'secret' ? id + '-h' : null });
        const hint = f.kind === 'secret' ? (f.set ? t('int.secretKept') : t('int.secretNew')) + (help ? ' ' + help : '') : help;
        body.appendChild(h('div', { class: 'field' }, h('label', { class: 'field__label', for: id, text: label }), input, hint ? h('span', { class: 'field__hint', id: id + '-h', text: hint }) : null));
        inputs[f.key] = { kind: f.kind, el: input, f: f };
      }
    }
    const en = switchRow('int-' + p.id + '-enabled', t(p.client ? 'int.accept' : 'int.send', { name: p.name }), null, p.enabled);
    body.appendChild(en.el);
    const msg = h('p', { class: 'message', 'aria-live': 'polite' });
    const save = h('button', { class: 'button', 'data-variant': 'primary', type: 'submit' }, t('int.save', { name: p.name }));
    body.appendChild(msg); body.appendChild(h('div', { class: 'form-actions' }, save));
    if (!p.client) body.appendChild(this.testBox(p, testEvents));
    const form = h('form', { class: 'panel', id: 'int-' + p.id, novalidate: true, 'aria-label': p.name },
      h('div', { class: 'panel__head' }, h('h3', { class: 'panel__title', text: p.name }), p.enabled ? status('ok', t('int.on')) : status('muted', t('int.off')), testOn ? status('warn', t('int.testModeOn')) : null), body);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clear(msg);
      const fields = {};
      for (const k of Object.keys(inputs)) { const i = inputs[k]; fields[k] = i.kind === 'toggle' ? String(i.el.getAttribute('aria-checked') === 'true') : i.el.value.trim(); }
      const enabled = en.sw.getAttribute('aria-checked') === 'true';
      if (enabled) {
        for (const k of Object.keys(inputs)) {
          const i = inputs[k];
          if (i.f.required && !fields[k] && !(i.kind === 'secret' && i.f.set)) {
            msg.appendChild(status('bad', t('severity.bad'))); msg.appendChild(h('span', { text: t('int.err.missing', { field: strOr('int.' + p.id + '.' + k, i.f.label), name: p.name }) }));
            i.el.setAttribute('aria-invalid', 'true'); i.el.focus(); return;
          }
        }
      }
      save.disabled = true; save.setAttribute('aria-busy', 'true');
      try {
        S.integrations = await api('PUT', '/admin/api/integrations/' + encodeURIComponent(p.id), { enabled: enabled, fields: fields });
        S.containers.clear();
        toast('ok', t('int.saved', { name: p.name }));
        this.render();
      } catch (err) {
        save.disabled = false; save.removeAttribute('aria-busy');
        msg.appendChild(status('bad', t('severity.bad'))); msg.appendChild(h('span', null, tn('toast.failed', { message: code(err.raw || err.message) })));
      }
    });
    return form;
  },
  // Sends one made-up event through this provider's saved settings, even
  // while it is off, and shows how the tag ended.
  testBox(p, events) {
    const keys = p.fields.map((f) => f.key);
    const hint = t('int.test.hint') + ' ' + (keys.indexOf('test_mode') >= 0 ? t('int.test.hint.mode')
      : keys.indexOf('test_event_code') >= 0 ? t('int.test.hint.code')
        : p.id === 'bigquery' ? t('int.test.hint.bigquery') : t('int.test.hint.none'));
    const ev = h('select', { class: 'select', 'data-inline': true, 'aria-label': t('int.test.event') }, events.map((n) => h('option', { value: n }, n)));
    const code = keys.indexOf('test_event_code') >= 0
      ? h('input', { class: 'input', 'data-mono': true, type: 'text', autocomplete: 'off', placeholder: t('int.test.code'), 'aria-label': t('int.test.code') }) : null;
    const mode = keys.indexOf('test_mode') >= 0 ? h('input', { type: 'checkbox', checked: true }) : null;
    const go = h('button', { class: 'button', 'data-variant': 'secondary', type: 'button' }, t('int.test.send'));
    const out = h('div', { class: 'stack', 'aria-live': 'polite' });
    go.addEventListener('click', async () => {
      go.disabled = true;
      clear(out).appendChild(h('p', { class: 'note', text: t('int.test.sending') }));
      const body = { event: ev.value };
      if (code) body.test_event_code = code.value.trim();
      if (mode) body.test_mode = mode.checked;
      try {
        const j = await api('POST', '/admin/api/integrations/' + encodeURIComponent(p.id) + '/test', body);
        clear(out).appendChild(j.entry ? this.testResult(j.entry) : h('p', { class: 'note', text: t('int.test.nothing') }));
      } catch (err) {
        clear(out).appendChild(boxedMessage('bad', errNode(err)));
      }
      go.disabled = false;
    });
    return h('div', { class: 'stack test-box' },
      h('p', { class: 'panel__title', text: t('int.test.title') }), h('p', { class: 'note', text: hint }),
      h('div', { class: 'cluster' }, ev, code, mode ? h('label', { class: 'check' }, mode, ' ', t('int.test.mode')) : null, go), out);
  },
  testResult(e) {
    const tone = (o) => (o === 'success' ? 'ok' : o === 'skipped' ? 'warn' : 'bad');
    const tags = h('div', { class: 'status-row' }, e.tags.map((tg) =>
      status(tone(tg.outcome), tg.tag + ': ' + tg.outcome + (tg.skip ? ' (' + tg.skip + ')' : '') + (tg.error ? ' (' + tg.error + ')' : ''))));
    const sends = e.sends.map((sd) => h('pre', { class: 'mono note', text: sd.from + ' → ' + sd.method + ' ' + sd.url + ' → '
      + (sd.result.Ok != null ? sd.result.Ok : 'error ' + sd.result.Err) + (sd.response ? '\n' + sd.response : '') }));
    return h('div', { class: 'stack' }, tags, e.client_error ? boxedMessage('bad', e.client_error) : null,
      sends.length || e.logs.length ? h('details', null, h('summary', { text: t('int.test.detail', { sends: e.sends.length, logs: e.logs.length }) }),
        ...sends, ...e.logs.map((l) => h('pre', { class: 'mono note', text: l }))) : null);
  },
  enrichment(e) {
    const url = h('input', { class: 'input', 'data-mono': true, id: 'enr-url', type: 'url', autocomplete: 'off', spellcheck: 'false', value: e.url, placeholder: t('enr.url.placeholder'), 'aria-describedby': 'enr-url-h' });
    const key = h('select', { class: 'select', id: 'enr-key' }, ['user_id', 'client_id'].map((k) => h('option', { value: k }, t('enr.key.' + k))));
    key.value = e.key || 'user_id';
    const hn = h('input', { class: 'input', 'data-mono': true, id: 'enr-hn', type: 'text', autocomplete: 'off', spellcheck: 'false', value: e.header_name, placeholder: t('enr.headerName.placeholder') });
    const hv = h('input', { class: 'input', 'data-mono': true, id: 'enr-hv', type: 'password', autocomplete: 'off', placeholder: e.header_value_set ? t('int.secretKept') : null, 'aria-describedby': e.header_value_set ? 'enr-hv-h' : null });
    const en = switchRow('enr-enabled', t('enr.use'), null, e.enabled);
    const eud = switchRow('enr-eud', t('enr.eventUserData'), t('enr.eventUserData.help'), !!e.event_user_data);
    const msg = h('p', { class: 'message', 'aria-live': 'polite' });
    const save = h('button', { class: 'button', 'data-variant': 'primary', type: 'submit' }, t('enr.save'));
    const form = h('form', { class: 'panel', id: 'int-enrichment', novalidate: true, 'aria-label': t('enr.title') },
      h('div', { class: 'panel__head' }, h('h3', { class: 'panel__title', text: t('enr.title') }), e.enabled || e.event_user_data ? status('ok', t('int.on')) : status('muted', t('int.off'))),
      h('div', { class: 'panel__body stack' }, h('p', { class: 'note', text: t('enr.lead') }), eud.el,
        h('div', { class: 'field' }, h('label', { class: 'field__label', for: 'enr-url', text: t('enr.url') }), url, h('span', { class: 'field__hint', id: 'enr-url-h' }, t('enr.url.help'), ' ', code(t('enr.url.example')))),
        h('div', { class: 'field' }, h('label', { class: 'field__label', for: 'enr-key', text: t('enr.key') }), key),
        h('div', { class: 'field' }, h('label', { class: 'field__label', for: 'enr-hn', text: t('enr.headerName') }), hn),
        h('div', { class: 'field' }, h('label', { class: 'field__label', for: 'enr-hv', text: t('enr.headerValue') }), hv, e.header_value_set ? h('span', { class: 'field__hint', id: 'enr-hv-h', text: t('int.secretKept') }) : null),
        en.el, msg, h('div', { class: 'form-actions' }, save)));
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      clear(msg);
      save.disabled = true; save.setAttribute('aria-busy', 'true');
      try {
        S.integrations = await api('PUT', '/admin/api/enrichment', { enabled: en.sw.getAttribute('aria-checked') === 'true', url: url.value.trim(), key: key.value, header_name: hn.value.trim(), header_value: hv.value.trim(), event_user_data: eud.sw.getAttribute('aria-checked') === 'true' });
        toast('ok', t('enr.saved'));
        this.render();
      } catch (err) {
        save.disabled = false; save.removeAttribute('aria-busy');
        msg.appendChild(status('bad', t('severity.bad'))); msg.appendChild(h('span', null, tn('toast.failed', { message: code(err.raw || err.message) })));
      }
    });
    return form;
  }
};

// ===== Boot =====
(function boot() {
  const th = lsGet(PREF.theme);
  document.documentElement.setAttribute('data-theme', th === 'light' ? 'light' : 'dark');
  const dn = lsGet(PREF.density);
  if (dn === 'compact') document.documentElement.setAttribute('data-density', 'compact');
  setLang(lsGet(PREF.lang) === 'tr' ? 'tr' : 'en');
  const skip = $('.skip-link');
  if (skip) skip.textContent = t('app.skip');
  if (!S.token) { showSignin(); return; }
  api('GET', '/admin/api/overview').then(startApp, (e) => {
    if (e.status === 401) return; // onUnauthorized already showed the sign-in
    S.token = ''; S.signinMsg = e.network ? 'signin.unreachable' : 'err.generic';
    showSignin();
  });
})();

})();
