<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>ai tagging server</title>
<link rel="icon" href="/admin/assets/favicon-ai-16.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/admin/assets/favicon-ai-16-ink.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<style>
/* ai tagging server console · CSS foundation (Art Director, 23 Oct 2026)
   Built on the Analitik İşler design system (direction D): tokens copied exactly from tokens.css, components derived
   from components/bundle.css and resized for a dense console. Paint only with color-* roles below the token block.
   Theme: dark is the default. No data-theme + system light = light. data-theme="dark|light" always wins.
   Breakpoints: 768 (single pane below), 1024 (stacked panes below, rail becomes a sheet). */

@layer tokens, base, layout, components, utilities;

/* ===== 1. Fonts (served by the binary) ===== */
@font-face { font-family: "Google Sans Flex"; src: url("/admin/assets/google-sans-flex-display.woff2") format("woff2"); font-weight: 540 600; font-style: normal; font-display: swap; }
@font-face { font-family: "Google Sans"; src: url("/admin/assets/google-sans-text.woff2") format("woff2"); font-weight: 400 600; font-style: normal; font-display: swap; }
@font-face { font-family: "Google Sans Code"; src: url("/admin/assets/google-sans-code.woff2") format("woff2"); font-weight: 400 600; font-style: normal; font-display: swap; }

/* ===== 2. Design tokens (exact copy of tokens.css; the only place ref-* and hex appear) ===== */
@layer tokens {
  :root, [data-theme="dark"] {
    --ref-white: #ffffff;
    --ref-navy-16: #040e1f; --ref-navy-20: #071529; --ref-navy-23: #0e1e34; --ref-navy-25: #142338; --ref-navy-27: #15263f;
    --ref-navy-33: #22354e; --ref-navy-43: #3a5170; --ref-navy-50: #566479; --ref-navy-56: #607695; --ref-navy-62: #78869a;
    --ref-navy-76: #a2b1c6; --ref-navy-80: #b3c0d2; --ref-navy-90: #d5dde8; --ref-navy-93: #e1e8f3; --ref-navy-95: #e9eef5;
    --ref-navy-96: #ecf1f8; --ref-navy-97: #f4f6fa; --ref-navy-99: #f9fbff;
    --ref-blue-32: #0c325b; --ref-blue-37: #123f6f; --ref-blue-42: #0e4896; --ref-blue-46: #0f56a8; --ref-blue-48: #1259b1;
    --ref-blue-50: #1161bb; --ref-blue-75: #69b1ff; --ref-blue-81: #8bc8ff; --ref-blue-89: #c6defc; --ref-blue-94: #deedff;
    --ref-orange-54: #b14c00; --ref-orange-63: #d46700; --ref-orange-75: #fa8c31;
    --ref-green-50: #197746; --ref-green-77: #5ad093; --ref-yellow-53: #8b6200; --ref-yellow-87: #f4cf5a;
    --ref-red-53: #c12d30; --ref-red-71: #fa6b6d;
    --color-bg: var(--ref-navy-20);
    --color-well: var(--ref-navy-16);
    --color-surface: var(--ref-navy-23);
    --color-surface-2: var(--ref-navy-27);
    --color-text: var(--ref-navy-93);
    --color-text-strong: var(--ref-navy-99);
    --color-muted: var(--ref-navy-76);
    --color-border: var(--ref-navy-33);
    --color-border-strong: var(--ref-navy-56);
    --color-accent: var(--ref-blue-75);
    --color-accent-ink: var(--ref-blue-81);
    --color-accent-soft: var(--ref-blue-32);
    --color-action: var(--ref-blue-75);
    --color-action-hover: var(--ref-blue-81);
    --color-on-action: var(--ref-navy-20);
    --color-focus: var(--color-accent);
    --color-selection: var(--ref-blue-37);
    --color-mark: var(--ref-orange-75);
    --color-mark-ink: var(--ref-orange-75);
    --ai-point: #FA6B6D; /* brand/BRAND.md §4: the point, dark */
    --color-ok: var(--ref-green-77);
    --color-warn: var(--ref-yellow-87);
    --color-bad: var(--ref-red-71);
    --color-info: var(--color-accent);
    --color-ph: var(--ref-navy-43);
    --color-ph-ink: var(--ref-navy-99);
    --color-code-bg: var(--color-well);
    --color-code-text: var(--color-text);
    --color-code-keyword: var(--color-accent);
    --color-code-string: var(--color-ok);
    --color-code-comment: var(--color-muted);
    --color-overlay: rgba(2, 8, 18, 0.72);
    --shadow-overlay: 0 16px 48px rgba(2, 8, 18, 0.55);
    --shadow-raised: 0 1px 2px rgba(0, 0, 0, 0.4);
    --font-grade: -25; color-scheme: dark;
  }
  [data-theme="light"] {
    --color-bg: var(--ref-navy-97);
    --color-well: var(--ref-navy-95);
    --color-surface: var(--ref-white);
    --color-surface-2: var(--ref-navy-96);
    --color-text: var(--ref-navy-25);
    --color-text-strong: var(--ref-navy-20);
    --color-muted: var(--ref-navy-50);
    --color-border: var(--ref-navy-90);
    --color-border-strong: var(--ref-navy-62);
    --color-accent: var(--ref-blue-50);
    --color-accent-ink: var(--ref-blue-46);
    --color-accent-soft: var(--ref-blue-94);
    --color-action: var(--ref-blue-48);
    --color-action-hover: var(--ref-blue-42);
    --color-on-action: var(--ref-white);
    --color-focus: var(--color-accent);
    --color-selection: var(--ref-blue-89);
    --color-mark: var(--ref-orange-63);
    --color-mark-ink: var(--ref-orange-54);
    --ai-point: #C12D30; /* brand/BRAND.md §4: the point, light */
    --color-ok: var(--ref-green-50);
    --color-warn: var(--ref-yellow-53);
    --color-bad: var(--ref-red-53);
    --color-info: var(--color-accent);
    --color-ph: var(--ref-navy-80);
    --color-ph-ink: var(--ref-navy-20);
    --color-code-bg: var(--color-well);
    --color-code-text: var(--color-text);
    --color-code-keyword: var(--color-accent);
    --color-code-string: var(--color-ok);
    --color-code-comment: var(--color-muted);
    --color-overlay: rgba(7, 21, 41, 0.48);
    --shadow-overlay: 0 16px 48px rgba(7, 21, 41, 0.14);
    --shadow-raised: 0 1px 2px rgba(7, 21, 41, 0.08);
    --font-grade: 0; color-scheme: light;
  }
  /* System light, no saved choice: the same light roles (keep in sync with the block above). */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --color-bg: var(--ref-navy-97); --color-well: var(--ref-navy-95); --color-surface: var(--ref-white); --color-surface-2: var(--ref-navy-96);
      --color-text: var(--ref-navy-25); --color-text-strong: var(--ref-navy-20); --color-muted: var(--ref-navy-50);
      --color-border: var(--ref-navy-90); --color-border-strong: var(--ref-navy-62);
      --color-accent: var(--ref-blue-50); --color-accent-ink: var(--ref-blue-46); --color-accent-soft: var(--ref-blue-94);
      --color-action: var(--ref-blue-48); --color-action-hover: var(--ref-blue-42); --color-on-action: var(--ref-white);
      --color-focus: var(--color-accent); --color-selection: var(--ref-blue-89);
      --color-mark: var(--ref-orange-63); --color-mark-ink: var(--ref-orange-54);
      --ai-point: #C12D30;
      --color-ok: var(--ref-green-50); --color-warn: var(--ref-yellow-53); --color-bad: var(--ref-red-53); --color-info: var(--color-accent);
      --color-ph: var(--ref-navy-80); --color-ph-ink: var(--ref-navy-20);
      --color-code-bg: var(--color-well); --color-code-text: var(--color-text); --color-code-keyword: var(--color-accent);
      --color-code-string: var(--color-ok); --color-code-comment: var(--color-muted);
      --color-overlay: rgba(7, 21, 41, 0.48); --shadow-overlay: 0 16px 48px rgba(7, 21, 41, 0.14); --shadow-raised: 0 1px 2px rgba(7, 21, 41, 0.08);
      --font-grade: 0; color-scheme: light;
    }
  }
  :root {
    --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
    --space-7: 2rem; --space-8: 2.5rem; --space-9: 3rem; --space-10: 4rem; --space-11: 5.5rem; --space-12: 6.5rem;
    --radius-cell: 1px; --radius-sm: 2px; --radius-md: 4px; --radius-lg: 6px; --radius-pill: 6px;
    --font-weight-regular: 400; --font-weight-medium: 500; --font-weight-bold: 600; --font-weight-display: 570; --font-weight-display-strong: 590;
    --text-leading-flat: 0.96; --text-leading-tight: 1.04; --text-leading-snug: 1.22; --text-leading-normal: 1.6; --text-leading-lead: 1.5; --text-leading-loose: 1.75;
    --text-tracking-caps: 0.02em; --text-tracking-display: -0.012em; --text-tracking-section: -0.006em; --text-tracking-title: -0.012em; --text-tracking-figure: -0.02em;
    --border-width-hair: 1px; --border-width-thin: 2px; --border-width-thick: 3px;
    --text-measure: 66ch; --layout-wrap: 78rem; --layout-wrap-narrow: 48rem; --layout-header-h: 3.75rem; --layout-header-h-wide: 4.5rem;
    --layout-z-header: 20; --layout-z-consent: 40; --layout-z-overlay: 50;
    --font-display: "Google Sans Flex", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-body: "Google Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "Google Sans Code", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

    /* Motion (bundle.css values) */
    --motion-fast: 160ms; --motion-base: 220ms; --motion-slow: 400ms; --motion-stagger: 70ms;
    --motion-ease-out: cubic-bezier(0.2, 0, 0, 1); --motion-ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);

    /* Console type scale: fixed sizes, dense (no fluid steps in a tool). Nothing under 12 px. */
    --c-text-xs: 0.75rem;     /* 12: mono meta, tags, statuses, table heads, counts */
    --c-text-sm: 0.8125rem;   /* 13: table cells, code, list rows, kv values */
    --c-text-md: 0.875rem;    /* 14: body, controls, nav (= type style `label`) */
    --c-text-lg: 1rem;        /* 16: pane and panel titles */
    --c-text-xl: 1.3125rem;   /* 21: view title (display face) */
    --c-text-figure: 1.5rem;  /* 24: metric values */

    /* Console sizes */
    --c-rail-w: 232px;
    --c-list-w: 340px;
    --c-topbar-h: 48px;
    --c-control-h: 32px;      /* buttons, inputs, selects */
    --c-control-h-sm: 28px;   /* toolbar and in-row buttons, copy button */
    --c-row-pad: 6px;
    --c-lockup-h: 24px;       /* visible lockup height in the rail; 20 px in the top bar below 1024 */
    --c-gutter: var(--space-4);
  }
  @media (pointer: coarse) { :root { --c-control-h: 40px; --c-control-h-sm: 36px; } }
}

/* ===== 3. Base ===== */
@layer base {
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--color-bg); color: var(--color-text);
    font-family: var(--font-body); font-size: var(--c-text-md); font-weight: var(--font-weight-regular); line-height: var(--text-leading-lead);
    font-variation-settings: "GRAD" var(--font-grade); font-synthesis: none; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  h1, h2, h3, h4, h5, h6, p, figure, blockquote, dl, dd, pre { margin: 0; }
  h1, h2, h3, h4, h5, h6 { color: var(--color-text-strong); font-size: inherit; font-weight: var(--font-weight-bold); line-height: var(--text-leading-snug); overflow-wrap: anywhere; text-wrap: balance; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  b, strong { font-weight: var(--font-weight-bold); color: var(--color-text-strong); }
  a { color: var(--color-accent); text-decoration-line: underline; text-decoration-thickness: var(--border-width-hair); text-underline-offset: 0.22em;
    text-decoration-color: color-mix(in oklab, currentColor 45%, transparent); }
  a:hover { text-decoration-color: currentColor; }
  code, kbd, samp, pre { font-family: var(--font-mono); font-variation-settings: normal; font-variant-ligatures: none; }
  code, kbd, samp { font-size: 0.9375em; }
  svg { flex: none; }
  img { display: block; max-width: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  table { border-collapse: collapse; }
  hr { margin: 0; border: 0; border-top: var(--border-width-hair) solid var(--color-border); }
  [hidden] { display: none !important; }
  ::selection { background: var(--color-selection); color: var(--color-text); }
  /* Focus: 2 px solid ring 3 px off; inset (-2px) wherever a scroll container would clip it (section 5 and below). */
  :focus-visible { outline: var(--border-width-thin) solid var(--color-focus); outline-offset: 3px; }
  :focus:not(:focus-visible) { outline: none; }
  @media (prefers-reduced-motion: reduce) {
    :root { --motion-fast: 0ms; --motion-base: 0ms; --motion-slow: 0ms; --motion-stagger: 0ms; }
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }
}

/* ===== 4. App shell: rail | main (top bar + view) ===== */
@layer layout {
  .skip-link { position: absolute; top: var(--space-2); left: var(--space-2); z-index: var(--layout-z-overlay); padding: var(--space-2) var(--space-3);
    background: var(--color-action); color: var(--color-on-action); border-radius: var(--radius-md); font-weight: var(--font-weight-bold); text-decoration: none; transform: translateY(-200%); }
  .skip-link:focus-visible { transform: none; }

  .app { display: grid; grid-template-columns: var(--c-rail-w) minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: hidden; }
  .app__main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
  .view { min-width: 0; min-height: 0; overflow: auto; overscroll-behavior: contain; }
  .view__inner { display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-5) var(--c-gutter) var(--space-8); max-width: 90rem; }

  /* Rail: sunken (color-well), lockup on top, nav, foot with version and instance note */
  .rail { display: flex; flex-direction: column; min-height: 0; background: var(--color-well); border-right: var(--border-width-hair) solid var(--color-border); }
  .rail__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); min-height: var(--c-topbar-h); padding: 0 var(--space-2) 0 var(--space-4); border-bottom: var(--border-width-hair) solid var(--color-border); }
  .rail__nav { flex: 1; overflow-y: auto; padding: var(--space-3) var(--space-2); }
  .rail__group + .rail__group { margin-top: var(--space-4); }
  .rail__label { padding: 0 var(--space-3) var(--space-1); color: var(--color-muted); font: var(--font-weight-medium) var(--c-text-xs) / 1.3 var(--font-mono); }
  .rail__foot { display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-3) var(--space-4); border-top: var(--border-width-hair) solid var(--color-border);
    color: var(--color-muted); font: var(--c-text-xs) / 1.5 var(--font-mono); }
  .rail__close { display: none; }

  .nav-item { position: relative; display: flex; align-items: center; gap: var(--space-2); min-height: 36px; padding: 0 var(--space-3); border-radius: var(--radius-sm);
    color: var(--color-muted); font-size: var(--c-text-md); font-weight: var(--font-weight-medium); text-decoration: none;
    transition: color var(--motion-fast) var(--motion-ease-out), background-color var(--motion-fast) var(--motion-ease-out); }
  .nav-item:hover { color: var(--color-text-strong); background: var(--color-surface-2); }
  .nav-item[aria-current] { color: var(--color-text-strong); background: var(--color-surface-2); box-shadow: inset var(--border-width-thin) 0 0 var(--color-accent); }
  .nav-item:focus-visible { outline-offset: -2px; }
  .nav-item > .count { margin-left: auto; }

  /* Top bar: view title, live state, tenant select, actions */
  .topbar { display: flex; align-items: center; gap: var(--space-3); min-height: var(--c-topbar-h); padding: var(--space-2) var(--c-gutter); background: var(--color-bg);
    border-bottom: var(--border-width-hair) solid var(--color-border); min-width: 0; }
  .topbar__title { min-width: 0; color: var(--color-text-strong); font: var(--font-weight-display) var(--c-text-xl) / 1.1 var(--font-display); letter-spacing: var(--text-tracking-title);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar__end { display: flex; align-items: center; gap: var(--space-2); margin-left: auto; flex: none; }
  .topbar__menu, .topbar__lockup { display: none; }

  /* Logos (brand/BRAND.md): the ink takes the text colour, the point stays red. */
  .brand-logo { display: block; width: auto; color: var(--color-text-strong); }
  .lockup { display: inline-flex; flex: none; align-items: center; line-height: 0; text-decoration: none; }
  .lockup .brand-logo { height: var(--c-lockup-h); }
  .rail__byline .brand-logo { display: inline-block; height: 0.95em; vertical-align: -0.12em; }

  /* Debugger: list | detail, each its own scroll region */
  .debugger { display: grid; grid-template-columns: var(--c-list-w) minmax(0, 1fr); min-height: 0; height: 100%; }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .pane + .pane { border-left: var(--border-width-hair) solid var(--color-border); }
  .pane__head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); min-height: 44px; padding: var(--space-2) var(--space-3); border-bottom: var(--border-width-hair) solid var(--color-border); }
  .pane__title { color: var(--color-text-strong); font-size: var(--c-text-lg); font-weight: var(--font-weight-bold); line-height: var(--text-leading-snug); }
  .pane__body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
  .pane__body:focus-visible { outline-offset: -2px; }
  .pane__pad { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4) var(--c-gutter) var(--space-7); }
  .pane__back { display: none; }

  /* Panel: a card on color-surface inside a view or the detail pane */
  .panel { min-width: 0; background: var(--color-surface); border: var(--border-width-hair) solid var(--color-border); border-radius: var(--radius-lg); }
  .panel__head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: var(--border-width-hair) solid var(--color-border); }
  .panel__title { color: var(--color-text-strong); font-size: var(--c-text-md); font-weight: var(--font-weight-bold); }
  .panel__body { padding: var(--space-4); }
  .panel__body[data-flush] { padding: 0; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .toolbar > .grow { flex: 1 1 10rem; min-width: 0; }
  .stack { display: flex; flex-direction: column; gap: var(--space-3); }
  .cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .grid-2 { display: grid; gap: var(--space-4); }
  @media (min-width: 1280px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* Below 1024: rail becomes a sheet (dialog), panes stack, the page scrolls as one */
  @media (max-width: 1023px) {
    .app { display: block; height: auto; overflow: visible; }
    .app__main { display: block; }
    .view { overflow: visible; }
    .rail { position: fixed; inset: 0 auto 0 0; z-index: var(--layout-z-overlay); width: min(var(--c-rail-w), 85vw); box-shadow: var(--shadow-overlay);
      border-right-color: var(--color-border-strong); transform: translateX(-100%); visibility: hidden;
      transition: transform var(--motion-base) var(--motion-ease-out), visibility 0s linear var(--motion-base); }
    .rail[data-open] { transform: none; visibility: visible; transition: transform var(--motion-base) var(--motion-ease-out); }
    .rail-scrim { position: fixed; inset: 0; z-index: calc(var(--layout-z-overlay) - 1); background: var(--color-overlay); }
    .rail__close { display: inline-grid; }
    .topbar { position: sticky; top: 0; z-index: var(--layout-z-header); --c-lockup-h: 20px; }
    .topbar__menu, .topbar__lockup { display: inline-flex; }
    .topbar__title { font-size: var(--c-text-lg); font-family: var(--font-body); font-weight: var(--font-weight-bold); }
    .debugger { display: flex; flex-direction: column; height: auto; }
    .pane + .pane { border-left: 0; border-top: var(--border-width-hair) solid var(--color-border-strong); }
    .debugger > .pane:first-child .pane__body { max-height: 45vh; max-height: 45dvh; }
    .debugger > .pane:last-child .pane__body { overflow: visible; }
  }
  @media (min-width: 1024px) { .rail-scrim { display: none; } }
  /* Below 768: one pane at a time. JS sets data-view="detail" when a hit is opened. */
  @media (max-width: 767px) {
    :root { --c-gutter: var(--space-4); }
    .topbar__title { display: none; }
    .debugger[data-view="list"] > .pane:last-child, .debugger:not([data-view]) > .pane:last-child { display: none; }
    .debugger[data-view="detail"] > .pane:first-child { display: none; }
    .debugger > .pane:first-child .pane__body { max-height: none; }
    .pane + .pane { border-top: 0; }
    .pane__back { display: inline-flex; }
  }
}

/* ===== 5. Components ===== */
@layer components {
  /* --- Type helpers --- */
  .view-title { color: var(--color-text-strong); font: var(--font-weight-display) var(--c-text-xl) / 1.1 var(--font-display); letter-spacing: var(--text-tracking-title); }
  .section-label { color: var(--color-muted); font: var(--font-weight-medium) var(--c-text-xs) / 1.3 var(--font-mono); }
  .meta { color: var(--color-muted); font: var(--c-text-xs) / 1.5 var(--font-mono); font-variant-numeric: tabular-nums; }
  .note { max-width: var(--text-measure); color: var(--color-muted); font-size: var(--c-text-sm); line-height: var(--text-leading-lead); }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .path { font-family: var(--font-mono); font-size: var(--c-text-sm); color: var(--color-text-strong); overflow-wrap: anywhere; }

  /* --- Icon --- */
  .icon { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; flex: none; }
  .icon[data-size="12"] { width: 12px; height: 12px; }
  .icon[data-size="14"] { width: 14px; height: 14px; }
  .icon[data-size="16"] { width: 16px; height: 16px; }
  .icon[data-rotate="90"] { transform: rotate(90deg); }
  .icon[data-rotate="180"] { transform: rotate(180deg); }
  .icon[data-rotate="270"] { transform: rotate(270deg); }

  /* --- Status: glyph + word, always both --- */
  .status { display: inline-flex; align-items: center; gap: 5px; color: var(--color-muted); font: var(--font-weight-medium) var(--c-text-xs) / 1.2 var(--font-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .status .icon { width: 11px; height: 11px; }
  .status[data-tone="ok"] { color: var(--color-ok); }
  .status[data-tone="warn"] { color: var(--color-warn); }
  .status:is([data-tone="bad"], [data-tone="risk"]) { color: var(--color-bad); }
  .status[data-tone="info"] { color: var(--color-info); }
  .status[data-tone="muted"] { color: var(--color-muted); }
  .status-row { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px var(--space-3); }
  .test-box { margin-top: var(--space-3); padding-top: var(--space-3); border-top: var(--border-width-hair) solid var(--color-border); }
  .test-box pre { margin: var(--space-1) 0 0; white-space: pre-wrap; word-break: break-all; }

  /* --- Tag: outlined mono label (event names, templates, methods) --- */
  .tag { display: inline-flex; align-items: center; gap: 5px; min-height: 20px; padding: 1px 6px; border: var(--border-width-hair) solid var(--color-border-strong); border-radius: var(--radius-sm);
    color: var(--color-text); font: var(--font-weight-medium) var(--c-text-xs) / 1.2 var(--font-mono); white-space: nowrap; text-decoration: none; }
  .tag[data-variant="accent"] { border-color: color-mix(in oklab, var(--color-accent) 60%, transparent); color: var(--color-accent-ink); }
  .tag[data-variant="plain"] { padding-inline: 0; border-color: transparent; color: var(--color-muted); }
  .tag .icon { width: 12px; height: 12px; }
  .count { display: inline-grid; place-items: center; min-width: 20px; height: 18px; padding: 0 5px; border: var(--border-width-hair) solid var(--color-border); border-radius: var(--radius-sm);
    color: var(--color-muted); font: var(--font-weight-medium) var(--c-text-xs) / 1 var(--font-mono); font-variant-numeric: tabular-nums; }

  /* --- Button: primary | secondary | ghost | danger; md 32 | sm 28 --- */
  .button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--c-control-h); padding: 0 12px;
    border: var(--border-width-hair) solid transparent; border-radius: var(--radius-md); background: transparent; color: var(--color-text-strong);
    font: var(--font-weight-bold) var(--c-text-md) / 1.1 var(--font-body); white-space: nowrap; text-decoration: none; cursor: pointer;
    transition: background-color var(--motion-fast) var(--motion-ease-out), border-color var(--motion-fast) var(--motion-ease-out), color var(--motion-fast) var(--motion-ease-out); }
  .button__icon { width: 14px; height: 14px; }
  .button[data-variant="primary"] { background: var(--color-action); color: var(--color-on-action); }
  .button[data-variant="primary"]:is(:hover, :active) { background: var(--color-action-hover); }
  .button[data-variant="secondary"] { border-color: var(--color-border-strong); }
  .button[data-variant="secondary"]:hover { border-color: var(--color-text-strong); background: var(--color-surface); }
  .button[data-variant="secondary"]:active { background: var(--color-surface-2); }
  .button[data-variant="ghost"] { color: var(--color-text); }
  .button[data-variant="ghost"]:hover { color: var(--color-text-strong); border-color: var(--color-border); background: var(--color-surface-2); }
  .button[data-variant="danger"] { border-color: var(--color-bad); color: var(--color-bad); }
  .button[data-variant="danger"]:hover { background: var(--color-surface-2); }
  .button[data-size="sm"] { min-height: var(--c-control-h-sm); padding-inline: 10px; font-size: var(--c-text-sm); }
  .button[data-size="sm"] .button__icon { width: 12px; height: 12px; }
  .button:is([disabled], [aria-disabled="true"]) { background: var(--color-surface-2); border-color: var(--color-border); color: var(--color-muted); cursor: not-allowed; }
  .button[aria-busy="true"] { cursor: progress; }

  /* --- Icon button: square, aria-label required --- */
  .icon-button { display: inline-grid; place-items: center; width: var(--c-control-h); height: var(--c-control-h); flex: none; padding: 0;
    border: var(--border-width-hair) solid var(--color-border-strong); border-radius: var(--radius-md); background: transparent; color: var(--color-text-strong);
    transition: background-color var(--motion-fast) var(--motion-ease-out), border-color var(--motion-fast) var(--motion-ease-out); }
  .icon-button:hover { background: var(--color-surface); border-color: var(--color-text-strong); }
  .icon-button .icon { width: 16px; height: 16px; }
  .icon-button[data-variant="quiet"] { border-color: transparent; }
  .icon-button[data-variant="quiet"]:hover { border-color: var(--color-border); background: var(--color-surface-2); }
  .icon-button[data-size="sm"] { width: var(--c-control-h-sm); height: var(--c-control-h-sm); }
  .icon-button[data-size="sm"] .icon { width: 14px; height: 14px; }
  .icon-button[aria-pressed="true"] { background: var(--color-surface-2); border-color: var(--color-text-strong); }
  .icon-button:is([disabled], [aria-disabled="true"]) { background: var(--color-surface-2); border-color: var(--color-border); color: var(--color-muted); cursor: not-allowed; }
  .theme-toggle__to-dark { display: none; }
  :root[data-theme="light"] .theme-toggle__to-dark { display: block; }
  :root[data-theme="light"] .theme-toggle__to-light { display: none; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) .theme-toggle__to-dark { display: block; }
    :root:not([data-theme]) .theme-toggle__to-light { display: none; }
  }

  /* --- Copy button --- */
  .copy-button { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 0 7px; border: var(--border-width-hair) solid var(--color-border-strong); border-radius: var(--radius-sm);
    background: transparent; color: var(--color-text); font: var(--font-weight-medium) var(--c-text-xs) / 1 var(--font-mono); white-space: nowrap;
    transition: border-color var(--motion-fast) var(--motion-ease-out), background-color var(--motion-fast) var(--motion-ease-out); }
  .copy-button:hover { border-color: var(--color-text-strong); background: var(--color-surface-2); }
  .copy-button .icon { width: 12px; height: 12px; }
  .copy-button[data-state="copied"] { border-color: var(--color-ok); color: var(--color-ok); }

  /* --- Fields: input, select, textarea --- */
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field__label { color: var(--color-text-strong); font-size: var(--c-text-sm); font-weight: var(--font-weight-medium); }
  .field__hint { color: var(--color-muted); font-size: var(--c-text-xs); line-height: 1.4; }
  .input, .select, .textarea { width: 100%; min-width: 0; min-height: var(--c-control-h); padding: 0 10px; background: var(--color-bg); color: var(--color-text-strong);
    border: var(--border-width-hair) solid var(--color-border-strong); border-radius: var(--radius-md); font-size: var(--c-text-md); line-height: 1.3;
    transition: border-color var(--motion-fast) var(--motion-ease-out); }
  .select[data-inline] { width: auto; max-width: 14rem; }
  .input:hover, .select:hover, .textarea:hover { border-color: var(--color-text); }
  .input:focus-visible, .select:focus-visible, .textarea:focus-visible { outline-offset: 1px; border-color: var(--color-accent); }
  .input::placeholder, .textarea::placeholder { color: var(--color-muted); opacity: 1; }
  .input[data-mono], .textarea { font-family: var(--font-mono); font-size: var(--c-text-sm); font-variation-settings: normal; }
  .textarea { min-height: 7rem; padding: 8px 10px; line-height: var(--text-leading-lead); resize: vertical; }
  .select { appearance: none; padding-right: 30px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 14px top 50%, right 9px top 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  .input:is([disabled], [readonly]), .select[disabled], .textarea:is([disabled], [readonly]) { background: var(--color-surface-2); border-color: var(--color-border); color: var(--color-muted); }
  .input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--color-bad); }
  .input-group { position: relative; display: flex; align-items: center; min-width: 0; }
  .input-group > .icon { position: absolute; left: 10px; width: 14px; height: 14px; color: var(--color-muted); pointer-events: none; }
  .input-group > .input { padding-left: 30px; }
  .check { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--c-text-sm); cursor: pointer; }
  .check > input { width: 16px; height: 16px; margin: 0; accent-color: var(--color-action); }

  /* --- Switch (role=switch), DS size --- */
  .switch { position: relative; flex: none; width: 40px; height: 22px; padding: 0; border: var(--border-width-hair) solid var(--color-border-strong); border-radius: var(--radius-sm);
    background: var(--color-bg); transition: background-color var(--motion-fast) var(--motion-ease-out), border-color var(--motion-fast) var(--motion-ease-out); }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: var(--radius-cell); background: var(--color-muted);
    transition: transform var(--motion-fast) var(--motion-ease-out), background-color var(--motion-fast) var(--motion-ease-out); }
  .switch[aria-checked="true"] { background: var(--color-action); border-color: var(--color-action); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--color-on-action); }
  .switch:is([disabled], [aria-disabled="true"]) { background: var(--color-surface-2); border-color: var(--color-border); cursor: not-allowed; }
  .switch-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px var(--space-3); }
  .switch-row > .switch { grid-row: 1 / span 2; grid-column: 2; }
  .switch-row__name { color: var(--color-text-strong); font-weight: var(--font-weight-medium); }
  .switch-row__line { grid-column: 1; color: var(--color-muted); font-size: var(--c-text-xs); }

  /* --- Tabs --- */
  .tabs { min-width: 0; }
  .tabs__list { display: flex; overflow-x: auto; border-bottom: var(--border-width-hair) solid var(--color-border); scrollbar-width: none; }
  .tabs__tab { display: inline-flex; align-items: center; gap: 6px; flex: none; min-height: 36px; padding: 0 12px; border: 0; border-bottom: var(--border-width-thin) solid transparent; margin-bottom: -1px;
    background: none; color: var(--color-muted); font: var(--font-weight-medium) var(--c-text-sm) / 1 var(--font-mono); white-space: nowrap; }
  .tabs__tab:hover { color: var(--color-text-strong); }
  .tabs__tab[aria-selected="true"] { color: var(--color-text-strong); border-bottom-color: var(--color-accent); }
  .tabs__tab:focus-visible { outline-offset: -2px; }
  .tabs__tab > .count { height: 16px; min-width: 18px; }
  .tabs__panel { padding-top: var(--space-4); }
  .tabs__panel:focus-visible { outline-offset: 4px; }
  @media (pointer: coarse) { .tabs__tab { min-height: 44px; } }

  /* --- Table: dense, sticky head, mono numbers right --- */
  .table { position: relative; max-width: 100%; overflow: auto; overscroll-behavior: contain; --table-ground: var(--color-bg); }
  .table[data-scroll] { max-height: var(--table-max-h, 60vh); }
  .panel .table { --table-ground: var(--color-surface); }
  .table:focus-visible { outline-offset: -2px; }
  .table table { width: 100%; font-size: var(--c-text-sm); line-height: 1.4; }
  .table :is(th, td) { padding: var(--c-row-pad) var(--space-3); border-bottom: var(--border-width-hair) solid var(--color-border); text-align: left; vertical-align: top; }
  .table thead th { position: sticky; top: 0; z-index: 1; background: var(--table-ground); color: var(--color-muted); border-bottom: 0;
    box-shadow: inset 0 calc(-1 * var(--border-width-hair)) 0 var(--color-border-strong); font: var(--font-weight-medium) var(--c-text-xs) / 1.3 var(--font-mono); white-space: nowrap; }
  .table tbody th { color: var(--color-text-strong); font-weight: var(--font-weight-bold); }
  .table :is(th, td)[data-num] { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table td[data-mono] { font-family: var(--font-mono); overflow-wrap: anywhere; }
  .table td[data-fit], .table th[data-fit] { width: 1%; white-space: nowrap; }
  .table tbody tr[data-href] { cursor: pointer; }
  .table tbody tr:is([data-href], [aria-selected]):hover { background: var(--color-surface-2); }
  .table tbody tr[aria-selected="true"] { background: var(--color-accent-soft); }
  .table tbody tr:focus-visible { outline-offset: -2px; }
  .table caption { padding: 0 0 var(--space-2); color: var(--color-muted); font-size: var(--c-text-xs); text-align: left; }
  .table[data-wide] table { min-width: 40rem; }

  /* --- Hit list (debugger left pane) --- */
  .hit-list > li + li { border-top: var(--border-width-hair) solid var(--color-border); }
  .hit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px var(--space-2); padding: 8px var(--space-3); color: var(--color-text); text-decoration: none;
    transition: background-color var(--motion-fast) var(--motion-ease-out); }
  .hit:hover { background: var(--color-surface-2); }
  .hit[aria-current] { background: var(--color-accent-soft); box-shadow: inset var(--border-width-thin) 0 0 var(--color-accent); }
  .hit:focus-visible { outline-offset: -2px; }
  .hit__line { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; }
  .hit__method { flex: none; color: var(--color-muted); font: var(--font-weight-medium) var(--c-text-xs) / 1.3 var(--font-mono); }
  .hit__path { min-width: 0; color: var(--color-text-strong); font: var(--font-weight-medium) var(--c-text-sm) / 1.3 var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hit__time { color: var(--color-muted); font: var(--c-text-xs) / 1.3 var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .hit__events { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
  .hit__result { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px var(--space-3); }
  .hit-list__more { display: flex; justify-content: center; padding: var(--space-3); }

  /* --- Code block: JSON, headers, logs --- */
  .codeblock { position: relative; min-width: 0; overflow: hidden; background: var(--color-code-bg); border: var(--border-width-hair) solid var(--color-border); border-radius: var(--radius-lg); }
  .codeblock__bar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px var(--space-3); min-height: 36px; padding: 4px 6px 4px var(--space-3); border-bottom: var(--border-width-hair) solid var(--color-border);
    color: var(--color-muted); font: var(--c-text-xs) / 1.3 var(--font-mono); }
  .codeblock__path { min-width: 0; color: var(--color-code-text); overflow-wrap: anywhere; }
  .codeblock__bar > :last-child:is(.copy-button, .cluster) { margin-left: auto; }
  .codeblock pre { max-height: var(--code-max-h, 28rem); padding: var(--space-3) var(--space-4); overflow: auto; color: var(--color-code-text); font-size: var(--c-text-sm); line-height: 1.6; tab-size: 2; }
  .codeblock pre[data-wrap] { white-space: pre-wrap; overflow-wrap: anywhere; }
  .codeblock pre:focus-visible { outline-offset: -2px; }
  .codeblock pre code { font-size: inherit; }
  .codeblock__foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-top: var(--border-width-hair) solid var(--color-border); font-size: var(--c-text-xs); }
  /* The six highlight roles. JSON: key .k, string .s, number/boolean .w, null and redacted .c */
  .codeblock :is(.k, .a) { color: var(--color-code-keyword); }
  .codeblock :is(.s, .g) { color: var(--color-code-string); }
  .codeblock :is(.c, .m) { color: var(--color-code-comment); }
  .codeblock .y { color: var(--color-warn); }
  .codeblock :is(.r, .o) { color: var(--color-bad); }
  .codeblock .w { color: var(--color-text-strong); }
  .codeblock .mark { color: var(--color-text-strong); box-shadow: inset 0 calc(-1 * var(--border-width-thick)) 0 var(--color-mark); }
  /* Log lines: one per row, level as a Status */
  .log { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 var(--space-3); }
  .log > .status { padding-top: 3px; }
  .log > code { font-size: var(--c-text-sm); overflow-wrap: anywhere; white-space: pre-wrap; }

  /* --- Key-value list --- */
  .kv { display: grid; grid-template-columns: minmax(7rem, max-content) minmax(0, 1fr); font-size: var(--c-text-sm); }
  .kv > dt, .kv > dd { padding: 5px 0; border-bottom: var(--border-width-hair) solid var(--color-border); }
  .kv > dt { padding-right: var(--space-4); color: var(--color-muted); font: var(--c-text-xs) / 1.7 var(--font-mono); overflow-wrap: anywhere; }
  .kv > dd { min-width: 0; color: var(--color-text-strong); font-family: var(--font-mono); overflow-wrap: anywhere; }
  .kv > dd[data-redacted] { color: var(--color-muted); }
  .kv > dd > .copy-button { margin-left: var(--space-2); vertical-align: 1px; }
  @media (max-width: 479px) {
    .kv { grid-template-columns: minmax(0, 1fr); }
    .kv > dt { padding-bottom: 0; border-bottom: 0; }
  }

  /* --- Disclosure: native details (trigger conditions, per-tag detail) --- */
  .disclosure { border-bottom: var(--border-width-hair) solid var(--color-border); }
  .disclosure > summary { display: flex; align-items: center; gap: var(--space-3); min-height: 40px; padding: 6px 0; color: var(--color-text-strong);
    font-weight: var(--font-weight-medium); line-height: var(--text-leading-snug); list-style: none; cursor: pointer; }
  .disclosure > summary::-webkit-details-marker { display: none; }
  .disclosure > summary:hover { color: var(--color-accent); }
  .disclosure > summary:focus-visible { outline-offset: -2px; }
  .disclosure__title { min-width: 0; flex: 1; overflow-wrap: anywhere; }
  .disclosure__icon { width: 14px; height: 14px; color: var(--color-muted); transition: transform var(--motion-fast) var(--motion-ease-out); }
  .disclosure[open] > summary .disclosure__icon { transform: rotate(180deg); }
  .disclosure__body { padding: 0 0 var(--space-3); }
  .disclosure__body > * + * { margin-top: var(--space-2); }
  .panel__body > .disclosure:first-child { border-top: var(--border-width-hair) solid var(--color-border); }

  /* --- AI: an explanation or audit finding list, set apart from the server's own data --- */
  .ai-box { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3) var(--space-4); background: var(--color-surface);
    border: var(--border-width-hair) solid var(--color-border); border-left: var(--border-width-thin) solid var(--color-accent); border-radius: var(--radius-sm); }
  .ai-box__head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .ai-box__head .icon { color: var(--color-accent); }
  .ai-list { display: flex; flex-direction: column; gap: var(--space-3); margin: 0; padding: 0; list-style: none; }
  .ai-list > li { display: flex; gap: var(--space-2); align-items: flex-start; }
  .ai-list > li > .stack { min-width: 0; }

  /* --- Callout: the one note per screen (per-instance buffer, privacy) --- */
  .callout { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3) var(--space-4); background: var(--color-surface);
    border: var(--border-width-hair) solid var(--color-border); border-left: var(--border-width-thin) solid var(--color-accent); border-radius: var(--radius-sm); font-size: var(--c-text-sm); }
  .callout__title { color: var(--color-text-strong); font-weight: var(--font-weight-bold); }

  /* --- Metric --- */
  /* Fixed column counts that divide six evenly, so no empty cell shows the rule colour. */
  .metrics { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--border-width-hair); background: var(--color-border);
    border: var(--border-width-hair) solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  @media (min-width: 400px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1280px) { .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  /* The top bar names the view from 768 px; below that the view's own heading does. */
  @media (min-width: 768px) { .view-head .view-title { display: none; } }
  .metric { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: var(--space-3) var(--space-4); background: var(--color-surface); }
  .metric__value { align-self: flex-start; color: var(--color-text-strong); font: var(--font-weight-medium) var(--c-text-figure) / 1.1 var(--font-mono); letter-spacing: var(--text-tracking-figure); font-variant-numeric: tabular-nums; }
  .metric[data-variant="highlight"] .metric__value { text-decoration: underline var(--border-width-thick) var(--color-mark); text-underline-offset: 0.3em; text-decoration-skip-ink: none; }
  .metric__label { color: var(--color-muted); font-size: var(--c-text-xs); line-height: 1.4; }
  .metric__foot { margin-top: auto; }

  /* --- Tally, console variant: one line, 10 px cells, plan on top, outcome below --- */
  .ctally { display: grid; grid-template-columns: minmax(5rem, max-content) auto minmax(0, 1fr); align-items: center; gap: var(--space-2) var(--space-3); font-size: var(--c-text-sm); }
  .ctally__label { color: var(--color-muted); font-size: var(--c-text-xs); }
  .ctally__cells { display: inline-grid; grid-auto-flow: column; grid-template-rows: 10px 10px; gap: 2px; }
  .ctally__cells > i { width: 10px; height: 10px; border: var(--border-width-hair) solid var(--color-border-strong); border-radius: var(--radius-cell); }
  .ctally__cells > i[data-cell="sent"] { background: var(--color-accent); border-color: var(--color-accent); }
  .ctally__cells > i[data-cell="missing"] { border-style: dashed; border-color: var(--color-bad); }
  .ctally__cells > i[data-cell="extra"] { background: var(--color-bad); border-color: var(--color-bad); }
  .ctally__cells > i[data-cell="gap"] { border-color: transparent; }
  .ctally__sum { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 2px var(--space-3); min-width: 0; }
  .ctally__count { color: var(--color-text-strong); font: var(--font-weight-medium) var(--c-text-sm) / 1 var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ctally__delta { font-family: var(--font-body); }
  /* Over ~40 units: bars (outline = expected, blue = done, red hatch = the gap); --v is the done share 0–1 */
  .tally-bars { display: grid; grid-template-columns: minmax(0, max-content) minmax(6rem, 1fr) auto; align-items: center; gap: var(--space-2) var(--space-3); }
  .tally-bars__label { color: var(--color-muted); font-size: var(--c-text-xs); overflow-wrap: break-word; }
  .tally-bars__track { position: relative; height: 14px; border: var(--border-width-hair) solid var(--color-border-strong); border-radius: var(--radius-cell); }
  .tally-bars__track::before, .tally-bars__track::after { content: ""; position: absolute; top: 2px; bottom: 2px; }
  .tally-bars__track::before { left: 2px; width: calc((100% - 4px) * var(--v, 1)); background: var(--color-accent); }
  .tally-bars__track::after { right: 2px; width: calc((100% - 4px) * (1 - var(--v, 1))); background: repeating-linear-gradient(135deg, var(--color-bad) 0 1.5px, transparent 1.5px 5px); }
  .tally-bars__value { color: var(--color-text-strong); font: var(--font-weight-medium) var(--c-text-sm) / 1 var(--font-mono); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* --- MiniBars: outcomes by tone (overview) --- */
  .minibars { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; align-items: center; gap: 6px var(--space-3); font: var(--c-text-xs) / 1.2 var(--font-mono); }
  .minibars__row { display: contents; }
  .minibars__label { display: inline-flex; align-items: center; gap: 5px; }
  .minibars__label .icon { width: 11px; height: 11px; }
  .minibars__track { height: 10px; border: var(--border-width-hair) solid var(--color-border); border-radius: var(--radius-cell); }
  .minibars__fill { display: block; width: var(--v, 0%); height: 100%; background: currentColor; }
  .minibars__row[data-tone="ok"] { color: var(--color-ok); }
  .minibars__row[data-tone="warn"] { color: var(--color-warn); }
  .minibars__row:is([data-tone="bad"], [data-tone="risk"]) { color: var(--color-bad); }
  .minibars__row[data-tone="risk"] .minibars__fill { background: repeating-linear-gradient(135deg, currentColor 0 1.5px, transparent 1.5px 4px); }
  .minibars__row[data-tone="muted"] { color: var(--color-muted); }
  .minibars__n { color: var(--color-text-strong); text-align: right; font-variant-numeric: tabular-nums; }

  /* --- Inline message and toast --- */
  .message { display: flex; align-items: flex-start; gap: var(--space-2); font-size: var(--c-text-sm); color: var(--color-text); }
  .message > .status { flex: none; padding-top: 2px; }
  .message[data-boxed] { padding: var(--space-2) var(--space-3); background: var(--color-surface-2); border: var(--border-width-hair) solid var(--color-border); border-radius: var(--radius-md); }
  .toasts { position: fixed; right: var(--space-4); bottom: var(--space-4); z-index: var(--layout-z-overlay); display: flex; flex-direction: column; gap: var(--space-2);
    width: min(24rem, calc(100vw - 2 * var(--space-4))); pointer-events: none; }
  .toast { display: flex; align-items: flex-start; gap: var(--space-2); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); pointer-events: auto;
    background: var(--color-surface); border: var(--border-width-hair) solid var(--color-border-strong); border-radius: var(--radius-md); font-size: var(--c-text-sm); color: var(--color-text); }
  .toast > .status { flex: none; padding-top: 3px; }
  .toast__text { flex: 1; min-width: 0; padding-block: 2px; overflow-wrap: anywhere; }

  /* --- Loading: flat blocks, no shimmer (motion is only for checking) --- */
  .skeleton { display: block; height: 0.9em; border-radius: var(--radius-cell); background: var(--color-surface-2); }
  .skeleton[data-w="1/3"] { width: 33%; } .skeleton[data-w="1/2"] { width: 50%; } .skeleton[data-w="2/3"] { width: 66%; }
  .skeleton-rows { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-3); }
  .loading { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--color-muted); font: var(--c-text-xs) / 1.3 var(--font-mono); }

  /* --- Empty state --- */
  .empty { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); max-width: 30rem; padding: var(--space-7) var(--c-gutter); }
  .empty__title { color: var(--color-text-strong); font-size: var(--c-text-lg); font-weight: var(--font-weight-bold); }
  .empty__text { color: var(--color-muted); font-size: var(--c-text-sm); }
  .empty > .cluster { margin-top: var(--space-2); }
  .empty code { color: var(--color-text-strong); }

  /* --- Sign-in (token) card --- */
  .signin { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: var(--space-6) var(--space-4); background: var(--color-well); }
  .signin__card { display: flex; flex-direction: column; gap: var(--space-4); width: min(24rem, 100%); padding: var(--space-6); background: var(--color-surface);
    border: var(--border-width-hair) solid var(--color-border); border-radius: var(--radius-lg); --c-lockup-h: 24px; }
}

/* ===== 6. Utilities ===== */
@layer utilities {
  .visually-hidden:not(:focus-within, :active) { position: absolute !important; width: 1px !important; height: 1px !important; overflow: hidden !important; clip-path: inset(50%) !important; white-space: nowrap !important; }
  .mono { font-family: var(--font-mono); font-variation-settings: normal; }
  .tabular { font-variant-numeric: tabular-nums; }
  .muted { color: var(--color-muted); }
  .strong { color: var(--color-text-strong); }
  .nowrap { white-space: nowrap; }
  .truncate { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ml-auto { margin-left: auto; }
}

/* ===== 7. Console extensions (Frontend, same tokens and conventions as above) ===== */
@layer layout {
  .rail__brand { display: flex; flex-direction: column; gap: 6px; padding: var(--space-3) 0; min-width: 0; }
  .rail__byline { color: var(--color-muted); font-size: var(--c-text-xs); line-height: 1.2; }
  .rail__tools { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-2); }
  .rail__tools .button { padding-inline: 8px; }
  .rail__foot a { color: var(--color-muted); }

  /* Three panes from 1280: list | events | detail */
  @media (min-width: 1280px) {
    .debugger[data-panes="3"] { grid-template-columns: var(--c-list-w) 200px minmax(0, 1fr); }
    .debugger .events-inline { display: none; }
  }
  @media (max-width: 1279px) {
    .debugger > .pane[data-role="events"] { display: none !important; }
  }
  .live-status { display: inline-flex; align-items: center; gap: var(--space-2); min-width: 0; }
  .live-status > .status { overflow: hidden; text-overflow: ellipsis; }
  .health { display: inline-flex; text-decoration: none; }
  .health:hover .status { text-decoration: underline; }
  .feature-group { margin: var(--space-5) 0 var(--space-2); color: var(--color-muted); font: var(--font-weight-medium) var(--c-text-xs) / 1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; }
  .feature-grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); }
  .feature { display: flex; flex-direction: column; align-items: stretch; gap: var(--space-2); min-width: 0; padding: var(--space-3) var(--space-4); text-align: left;
    border: var(--border-width-hair) solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text); font: inherit; cursor: pointer;
    transition: border-color var(--motion-fast) var(--motion-ease-out), background-color var(--motion-fast) var(--motion-ease-out); }
  .feature:hover { border-color: var(--color-border-strong); background: var(--color-surface-2); }
  .feature__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); }
  .feature__name { color: var(--color-text-strong); font-weight: var(--font-weight-medium); }
  .feature__line { color: var(--color-muted); font-size: var(--c-text-sm); line-height: var(--text-leading-lead); }
  .feature__detail { overflow: hidden; color: var(--color-text); font: var(--c-text-xs) / 1.3 var(--font-mono); text-overflow: ellipsis; white-space: nowrap; }
  .newhits { position: sticky; top: 0; z-index: 2; display: flex; justify-content: center; padding: var(--space-2); background: var(--color-bg); border-bottom: var(--border-width-hair) solid var(--color-border); }
  .list-meta { display: flex; flex-wrap: wrap; gap: 2px var(--space-3); padding: var(--space-2) var(--space-3); border-bottom: var(--border-width-hair) solid var(--color-border); }
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); width: 100%; }
  .filters .select { max-width: 11rem; min-height: var(--c-control-h-sm); font-size: var(--c-text-sm); }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: var(--c-control-h-sm); padding: 0 8px; border: var(--border-width-hair) solid var(--color-border-strong);
    border-radius: var(--radius-sm); background: transparent; color: var(--color-text); font: var(--font-weight-medium) var(--c-text-xs) / 1 var(--font-mono); white-space: nowrap;
    transition: background-color var(--motion-fast) var(--motion-ease-out), border-color var(--motion-fast) var(--motion-ease-out); }
  .chip:hover { border-color: var(--color-text-strong); background: var(--color-surface-2); }
  .chip[aria-pressed="true"] { border-color: var(--color-accent); background: var(--color-accent-soft); color: var(--color-text-strong); }
  .chip[aria-pressed="true"]::before { content: ""; width: 8px; height: 8px; background: var(--color-accent); border-radius: var(--radius-cell); }

  .event-list { display: flex; flex-direction: column; padding: var(--space-2); gap: 2px; }
  .event-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px var(--space-2); padding: 6px var(--space-2); border-radius: var(--radius-sm); color: var(--color-text); text-decoration: none; }
  .event-item:hover { background: var(--color-surface-2); }
  .event-item[aria-current] { background: var(--color-accent-soft); box-shadow: inset var(--border-width-thin) 0 0 var(--color-accent); }
  .event-item:focus-visible { outline-offset: -2px; }
  .event-item__n { color: var(--color-muted); font: var(--c-text-xs) / 1.5 var(--font-mono); }
  .event-item__name { min-width: 0; color: var(--color-text-strong); font: var(--font-weight-medium) var(--c-text-sm) / 1.4 var(--font-mono); overflow-wrap: anywhere; }
  .event-item .status-row { grid-column: 2; }
  .segmented { display: flex; flex-wrap: wrap; gap: var(--space-1); }
  .segmented > a { display: inline-flex; align-items: center; gap: 6px; min-height: var(--c-control-h-sm); padding: 0 8px; border: var(--border-width-hair) solid var(--color-border-strong);
    border-radius: var(--radius-sm); color: var(--color-text); font: var(--font-weight-medium) var(--c-text-xs) / 1 var(--font-mono); text-decoration: none; }
  .segmented > a:hover { background: var(--color-surface-2); }
  .segmented > a[aria-current] { border-color: var(--color-accent); background: var(--color-accent-soft); color: var(--color-text-strong); }

  .detail-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-2) var(--space-3); }
  .detail-head__text { flex: 1 1 14rem; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .detail-head__title { color: var(--color-text-strong); font: var(--font-weight-bold) var(--c-text-lg) / 1.3 var(--font-mono); overflow-wrap: anywhere; }
  .steps { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); font: var(--c-text-sm) / 1.4 var(--font-mono); color: var(--color-text); }
  .steps .icon { width: 12px; height: 12px; color: var(--color-muted); }
  .steps b { font-weight: var(--font-weight-medium); }
  .tally-box { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3) var(--space-4); background: var(--color-surface); border: var(--border-width-hair) solid var(--color-border); border-radius: var(--radius-lg); }
}

@layer components {
  :root[data-density="compact"] { --c-row-pad: 3px; }
  :root[data-density="compact"] .hit { padding-block: 4px; gap: 1px var(--space-2); }
  :root[data-density="compact"] .nav-item { min-height: 30px; }
  :root[data-density="compact"] .kv > dt, :root[data-density="compact"] .kv > dd { padding-block: 2px; }

  .hl { background: var(--color-selection); color: var(--color-text-strong); border-radius: var(--radius-cell); }
  .group-title { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); color: var(--color-muted); font: var(--font-weight-medium) var(--c-text-xs) / 1.3 var(--font-mono); }
  .group-title:first-child { margin-top: 0; }
  .reason { color: var(--color-text); font-size: var(--c-text-sm); overflow-wrap: anywhere; }
  .reason code, .note code, .message code, .empty__text code, .callout code, .field__hint code { color: var(--color-text-strong); overflow-wrap: anywhere; }
  .tagrow { display: grid; grid-template-columns: minmax(7.5rem, max-content) minmax(0, 1fr); gap: 2px var(--space-3); align-items: baseline; }
  .tagrow__name { color: var(--color-text-strong); font-weight: var(--font-weight-medium); overflow-wrap: anywhere; }
  .tagrow__meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 2px var(--space-3); }
  .tagrow .reason { grid-column: 2; }
  @media (max-width: 479px) { .tagrow { grid-template-columns: minmax(0, 1fr); } .tagrow__meta, .tagrow .reason { grid-column: 1; } }
  .disclosure > summary .tagrow { flex: 1; min-width: 0; }

  .flag { display: inline-flex; margin-left: 4px; vertical-align: -1px; }
  .flag .icon { width: 11px; height: 11px; }
  .flag[data-tone="warn"] { color: var(--color-warn); }
  .flag[data-tone="bad"] { color: var(--color-bad); }
  .flag[data-tone="muted"] { color: var(--color-muted); }
  .flag-list { display: flex; flex-direction: column; gap: 4px; }
  .val-null { color: var(--color-muted); }
  .cell-actions { display: flex; gap: 4px; justify-content: flex-end; }
  .table td .copy-button { white-space: nowrap; }
  .table tr[data-flag="bad"] td:first-child, .table tr[data-flag="warn"] td:first-child { color: var(--color-text-strong); }

  .url { font-family: var(--font-mono); font-size: var(--c-text-sm); overflow-wrap: anywhere; color: var(--color-text); }
  .url b { color: var(--color-text-strong); font-weight: var(--font-weight-bold); }
  .send { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3) 0; border-bottom: var(--border-width-hair) solid var(--color-border); }
  .send:first-child { padding-top: 0; }
  .send__head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-3); }
  .loglines { margin: 0; padding: var(--space-3) 0; counter-reset: line; }
  .loglines > li { display: grid; grid-template-columns: 3ch minmax(0, 1fr); gap: var(--space-3); padding: 1px var(--space-4); font: var(--c-text-sm) / 1.6 var(--font-mono); }
  .loglines > li > span:first-child { color: var(--color-muted); text-align: right; font-variant-numeric: tabular-nums; }
  .loglines > li > code { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--color-code-text); font-size: inherit; }
  .loglines b { color: var(--color-code-keyword); font-weight: var(--font-weight-medium); }

  .kbd, kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border: var(--border-width-hair) solid var(--color-border-strong); border-bottom-width: var(--border-width-thin);
    border-radius: var(--radius-sm); color: var(--color-text-strong); font: var(--font-weight-medium) var(--c-text-xs) / 1 var(--font-mono); }

  /* Dialog: confirm, shortcuts */
  .dialog { width: min(30rem, calc(100vw - 2 * var(--space-4))); max-height: calc(100dvh - 2 * var(--space-6)); padding: 0; overflow: auto; color: var(--color-text);
    background: var(--color-surface); border: var(--border-width-hair) solid var(--color-border-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay); }
  .dialog[data-size="wide"] { width: min(38rem, calc(100vw - 2 * var(--space-4))); }
  .dialog::backdrop { background: var(--color-overlay); }
  .dialog__body { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-5); }
  .dialog__title { color: var(--color-text-strong); font: var(--font-weight-display) var(--c-text-lg) / 1.25 var(--font-display); }
  .dialog__actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--space-2); padding: var(--space-3) var(--space-5); border-top: var(--border-width-hair) solid var(--color-border); }
  .keys { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-2) var(--space-4); align-items: center; font-size: var(--c-text-sm); }
  .keys > dt { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; color: var(--color-muted); font-size: var(--c-text-xs); }

  /* Forms (sites, integrations) */
  .form-grid { display: grid; gap: var(--space-4); }
  @media (min-width: 768px) { .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .form-grid > [data-span="2"] { grid-column: 1 / -1; } }
  .form-grid .textarea { min-height: 4.5rem; }
  .form-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
  .cards { display: grid; gap: var(--space-4); }
  @media (min-width: 1280px) { .cards[data-cols="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr)); gap: var(--border-width-hair); background: var(--color-border); border: var(--border-width-hair) solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
  .stats > div { display: flex; flex-direction: column; gap: 2px; padding: var(--space-2) var(--space-3); background: var(--color-surface); }
  .stats b { font: var(--font-weight-medium) var(--c-text-lg) / 1.1 var(--font-mono); font-variant-numeric: tabular-nums; }
  .stats span { color: var(--color-muted); font-size: var(--c-text-xs); }

  .view-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-2) var(--space-4); }
  .view-head__text { flex: 1 1 20rem; display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
  .callout__row { display: flex; align-items: flex-start; gap: var(--space-3); }
  .callout__row > p { flex: 1; min-width: 0; }
  .metric__sub { color: var(--color-text); font: var(--c-text-xs) / 1.4 var(--font-mono); font-variant-numeric: tabular-nums; }
  .metric__formula { color: var(--color-muted); font: var(--c-text-xs) / 1.4 var(--font-mono); }
  .metric .status { margin-top: 2px; }
  .metric__head { display: flex; justify-content: space-between; gap: var(--space-2); align-items: baseline; }

  .err-row { display: grid; grid-template-columns: minmax(8.5rem, max-content) minmax(0, 1fr) auto; gap: 4px var(--space-3); align-items: baseline; }
  .err-row__msg { min-width: 0; overflow-wrap: anywhere; color: var(--color-text-strong); }
  .err-row__meta { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 2px var(--space-3); }
  @media (max-width: 599px) { .err-row { grid-template-columns: minmax(0, 1fr) auto; } .err-row__msg { grid-column: 1 / -1; } .err-row__meta { grid-column: 1 / -1; } }

  .banner { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); padding: var(--space-2) var(--space-3); background: var(--color-surface-2);
    border-bottom: var(--border-width-hair) solid var(--color-border); font-size: var(--c-text-sm); }
  .banner > p { flex: 1 1 14rem; min-width: 0; }
  .signin__lead { color: var(--color-muted); font-size: var(--c-text-sm); }
  .signin__title { color: var(--color-text-strong); font: var(--font-weight-display) var(--c-text-xl) / 1.15 var(--font-display); }
  .pw { display: flex; gap: var(--space-2); }
  .pw > .input { flex: 1; }

  /* Tables stack into key/value rows on narrow screens */
  @media (max-width: 599px) {
    .table[data-stack] table, .table[data-stack] tbody, .table[data-stack] tr, .table[data-stack] td, .table[data-stack] th { display: block; width: auto; }
    .table[data-stack] thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .table[data-stack] tr { padding: var(--space-2) 0; border-bottom: var(--border-width-hair) solid var(--color-border); }
    .table[data-stack] :is(td, th) { padding: 2px var(--space-3); border: 0; text-align: left !important; white-space: normal !important; }
    .table[data-stack] td[data-label]::before { content: attr(data-label); display: block; color: var(--color-muted); font: var(--c-text-xs) / 1.4 var(--font-mono); }
    .table[data-stack] td[data-fit] { width: auto; }
  }
}

@layer utilities {
  .mt-2 { margin-top: var(--space-2); }
  .gap-1 { gap: var(--space-1); }
  .wrap-any { overflow-wrap: anywhere; }
}
@layer layout { .pane__head > .input-group { flex: 1 1 100%; } .pane__head > .filters { flex: 1 1 100%; } }
/* Layer order: components override layout, so the shell's hide rules for buttons live here. */
@layer components {
  .rail__close, .topbar__menu, .pane__back { display: none; }
  @media (max-width: 1023px) { .rail__close, .topbar__menu { display: inline-grid; } }
  @media (max-width: 767px) { .pane__back { display: inline-flex; } }
}
@layer components {
  .table[data-vars] table { table-layout: fixed; }
  .table[data-vars] th:nth-child(1) { width: 32%; }
  .table[data-vars] th:nth-child(3) { width: 5rem; }
  .table[data-vars] th:nth-child(4) { width: 5.5rem; }
  .table[data-vars] td { overflow-wrap: anywhere; }
  @media (max-width: 599px) { .table[data-vars] table { table-layout: auto; } }
}
@layer utilities { .view:focus, .view:focus-visible { outline: none; } }
@layer components { @media (max-width: 599px) { .live-status > .status { display: none; } .list-meta [data-live-word] { display: inline; } } .list-meta [data-live-word] { display: none; } }
@layer components {
  @media (max-width: 599px) {
    .ctally { grid-template-columns: minmax(4rem, max-content) minmax(0, 1fr); }
    .ctally__sum { grid-column: 1 / -1; }
    .tally-bars { grid-template-columns: minmax(0, max-content) minmax(4rem, 1fr); }
    .tally-bars__value { grid-column: 1 / -1; text-align: left; white-space: normal; }
  }
  @media (max-width: 1023px) { .view { overflow-x: clip; } }
}
@layer components { .send__head > .status, .tagrow > .status, .problem .status { white-space: normal; } @media (max-width: 479px) { .status { white-space: normal; } } }
@layer components { .stats { gap: 0; background: var(--color-surface); } .stats > div { box-shadow: inset -1px -1px 0 var(--color-border); } }
@layer components { .err-row > .count { justify-self: end; } @media (max-width: 599px) { .err-row > .count { grid-column: 2; grid-row: 1; } } }
@layer components { .ctally__cells { justify-self: start; } }

@layer components {
  /* Tag editor: repeated settings and condition rows */
  .edrows { display: flex; flex-direction: column; gap: var(--space-3); }
  .edrows:empty { display: none; }
  .edrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(7rem, 11rem) minmax(0, 1.5fr) auto; gap: var(--space-2) var(--space-3); align-items: start;
    padding-bottom: var(--space-3); border-bottom: var(--border-width-hair) solid var(--color-border); }
  .edrow > :nth-child(3) { grid-column: 3; }
  .edrow__end { grid-column: 4; padding-top: 22px; }
  @media (max-width: 767px) {
    .edrow { grid-template-columns: minmax(0, 1fr) auto; }
    .edrow > :nth-child(n) { grid-column: 1 / -1; }
    .edrow > :first-child { grid-column: 1; }
    .edrow > .edrow__end { grid-column: 2; grid-row: 1; }
  }
}

let gAt = 0;
function typing(el) {

  if (!S.token || $('#app').hidden) return;

  const el = document.activeElement;
  if (e.key === 'Escape') {
    if (typing(el)) {
      if (el.type === 'search' && el.value) { el.value = ''; el.dispatchEvent(new Event('input')); }
      else el.blur();

    }
    if ($('#rail') && $('#rail').hasAttribute('data-open')) { toggleSheet(false); return; }
    if (S.view === 'live' && VIEWS.live.escape()) { e.preventDefault(); return; }
    if (el && el !== document.body) el.blur();
    return;
  }
  if (typing(el)) return;
  const k = e.key;
  if (gAt && Date.now() - gAt < 1200) {
    gAt = 0;
    const m = { o: 'overview', l: 'live', e: 'errors', t: 'container' }[k];
    if (m) { e.preventDefault(); go(hashFor([m], m === 'live' ? liveQuery() : scopeQuery())); }
    return;
  }
  if (k === 'g') { gAt = Date.now(); return; }
  if (k === '?' || (e.shiftKey && e.code === 'Slash')) { e.preventDefault(); helpDialog(); return; }
  if (k === 't') { setTheme(theme() === 'dark' ? 'light' : 'dark'); rerenderAll(); return; }
  if (k === 'p') { if (S.cap) setPaused(!S.paused); return; }
  if (k === '/') {
    e.preventDefault();
    if (S.view !== 'live') go(hashFor(['live'], liveQuery()));
    setTimeout(() => { const s = $('#hit-search'); if (s) s.focus(); }, 0);
    return;
  }
  if (S.view === 'live' && VIEWS.live.key(e)) e.preventDefault();
});
