# Deploy with: npx wrangler deploy  (from this folder)
# Then set the secret once: npx wrangler secret put PROXY_SECRET
name = "tagging-server-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

# Pick your own short, meaningless path and use it in both places below.
# Ad blockers match words like analytics, metrics, tracking, gtm, gtag or ad.
routes = [
  { pattern = "example.com/k7q2/*", zone_name = "example.com" },
]

[vars]
PATH_PREFIX = "/k7q2"
# The Cloud Run service URL, printed by deploy/cloud-run.sh.
ORIGIN_URL = "https://REPLACE-WITH-CLOUD-RUN-URL"

# Requests per visitor IP to your path: 100 per 10 seconds (period is 10 or
# 60). A page view sends a few, so only floods hit it. The count is kept per
# Cloudflare location and is approximate. Remove this block to turn it off.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 10 }
