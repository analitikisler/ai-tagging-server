[package]
name = "tagging-server"
version = "0.1.0"
edition = "2024"
description = "A self-hosted server-side tagging server, compatible with server-side Google Tag Manager"
license = "MIT"
repository = "https://github.com/analitikisler/ai-tagging-server"
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
hmac = "0.13.0"
oxc_allocator = "0.155.0"
oxc_ast = "0.154.0"
oxc_ast_visit = "0.154.0"
oxc_parser = "0.154.0"
oxc_semantic = "0.154.0"
oxc_span = "0.154.0"
percent-encoding = "2.3.2"
psl = "2.1.241"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
ring = "0.17.14"
rquickjs = { version = "0.14.0", features = ["futures", "macro", "loader"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
